<VirtualHost *:80>
    DocumentRoot "c:/laragon/www/PolyFlix/public"
    ServerName polyflix.test
    ServerAlias *.polyflix.test
    
    <Directory "c:/laragon/www/PolyFlix/public">
        AllowOverride All
        Require all granted
        Options Indexes FollowSymLinks
        
        # Enable mod_rewrite
        RewriteEngine On
        
        # Handle Authorization Header
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        
        # Redirect Trailing Slashes If Not A Folder...
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]
        
        # Send Requests To Front Controller...
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>
    
    ErrorLog "c:/laragon/logs/polyflix_error.log"
    CustomLog "c:/laragon/logs/polyflix_access.log" combined
</VirtualHost>
