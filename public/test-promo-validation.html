<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Test Validation Mã Khuyến Mãi</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    </head>
    <body>
        <div class="container mt-4">
            <h2>Test Validation Mã Khuyến Mãi</h2>

            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5>Thông tin đặt vé</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Đặt vé ID:</label>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="dat-ve-id"
                                    value="80"
                                    placeholder="Nhập ID đặt vé"
                                />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Tổng tiền:</label>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="tong-tien"
                                    value="75072"
                                    placeholder="Nhập tổng tiền"
                                />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Loại sản phẩm:</label>
                                <select class="form-control" id="loai-san-pham">
                                    <option value="ve">Vé phim</option>
                                    <option value="do_an">Đồ ăn/Combo</option>
                                    <option value="tat_ca">Tất cả</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mã khuyến mãi:</label>
                                <div class="input-group">
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="promo-code"
                                        placeholder="Nhập mã khuyến mãi"
                                    />
                                    <button
                                        class="btn btn-primary"
                                        id="test-promo"
                                    >
                                        Test
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5>Kết quả Test</h5>
                        </div>
                        <div class="card-body">
                            <div id="result-container">
                                <p class="text-muted">
                                    Nhập mã khuyến mãi và nhấn Test để kiểm tra
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5>Test Cases Gợi Ý</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4">
                                    <button
                                        class="btn btn-outline-secondary btn-sm mb-2 test-case"
                                        data-code="test00"
                                        data-dat-ve="80"
                                        data-tong="75072"
                                        data-loai="ve"
                                    >
                                        Test Mã: test00 (Vé phim)
                                    </button>
                                </div>
                                <div class="col-md-4">
                                    <button
                                        class="btn btn-outline-secondary btn-sm mb-2 test-case"
                                        data-code="test00"
                                        data-dat-ve="80"
                                        data-tong="75072"
                                        data-loai="do_an"
                                    >
                                        Test Mã: test00 (Đồ ăn)
                                    </button>
                                </div>
                                <div class="col-md-4">
                                    <button
                                        class="btn btn-outline-secondary btn-sm mb-2 test-case"
                                        data-code="invalidcode"
                                        data-dat-ve="80"
                                        data-tong="75072"
                                        data-loai="ve"
                                    >
                                        Test Mã không tồn tại
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Test promotion code
            function testPromoCode(promoCode, datVeId, tongTien, loaiSanPham) {
                const data = {
                    _token: "test-token", // Trong môi trường thực tế cần CSRF token
                    ma_khuyen_mai: promoCode,
                    tong_tien: tongTien,
                    loai_san_pham: loaiSanPham,
                };

                if (datVeId) {
                    data.dat_ve_id = datVeId;
                }

                console.log("Testing with data:", data);

                $.ajax({
                    url: "/khuyen-mai/check-code",
                    method: "POST",
                    data: data,
                    success: function (response) {
                        displayResult(response, true);
                    },
                    error: function (xhr) {
                        let errorResponse;
                        try {
                            errorResponse = JSON.parse(xhr.responseText);
                        } catch (e) {
                            errorResponse = {
                                success: false,
                                message: "Lỗi server: " + xhr.status,
                            };
                        }
                        displayResult(errorResponse, false);
                    },
                });
            }

            function displayResult(response, isSuccess) {
                const container = $("#result-container");

                if (response.success) {
                    container.html(`
                    <div class="alert alert-success">
                        <h6><i class="fa fa-check"></i> Thành công!</h6>
                        <p><strong>Message:</strong> ${response.message}</p>
                        <p><strong>Mã KM:</strong> ${
                            response.data.ma_khuyen_mai
                        }</p>
                        <p><strong>Tên KM:</strong> ${response.data.ten}</p>
                        <p><strong>Giảm giá:</strong> ${Number(
                            response.data.giam_gia
                        ).toLocaleString()} VNĐ</p>
                        <p><strong>Tổng sau giảm:</strong> ${Number(
                            response.data.tong_sau_giam
                        ).toLocaleString()} VNĐ</p>
                        ${
                            response.order_updated
                                ? '<p class="text-success"><i class="fa fa-info"></i> Đơn hàng đã được cập nhật</p>'
                                : ""
                        }
                    </div>
                `);
                } else {
                    container.html(`
                    <div class="alert alert-danger">
                        <h6><i class="fa fa-times"></i> Thất bại!</h6>
                        <p><strong>Message:</strong> ${
                            response.message || "Lỗi không xác định"
                        }</p>
                    </div>
                `);
                }
            }

            // Event handlers
            $("#test-promo").click(function () {
                const promoCode = $("#promo-code").val();
                const datVeId = $("#dat-ve-id").val();
                const tongTien = $("#tong-tien").val();
                const loaiSanPham = $("#loai-san-pham").val();

                if (!promoCode) {
                    alert("Vui lòng nhập mã khuyến mãi");
                    return;
                }

                testPromoCode(promoCode, datVeId, tongTien, loaiSanPham);
            });

            $(".test-case").click(function () {
                const code = $(this).data("code");
                const datVe = $(this).data("dat-ve");
                const tong = $(this).data("tong");
                const loai = $(this).data("loai");

                $("#promo-code").val(code);
                $("#dat-ve-id").val(datVe);
                $("#tong-tien").val(tong);
                $("#loai-san-pham").val(loai);

                testPromoCode(code, datVe, tong, loai);
            });

            // Enter key support
            $("#promo-code").keypress(function (e) {
                if (e.which == 13) {
                    $("#test-promo").click();
                }
            });
        </script>
    </body>
</html>
