<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Test ZaloPay với Mã Khuyến Mãi</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    </head>
    <body>
        <div class="container mt-4">
            <h2>Test ZaloPay với Mã Khuyến Mãi</h2>

            <div class="card">
                <div class="card-body">
                    <h5>Thông tin đặt vé</h5>
                    <p><strong>Đặt vé ID:</strong> 80</p>
                    <p>
                        <strong>Tổng tiền gốc:</strong>
                        <span id="original-price">75,072 VND</span>
                    </p>

                    <div class="mt-3">
                        <label for="promo-code" class="form-label"
                            >Mã khuyến mãi:</label
                        >
                        <div class="input-group">
                            <input
                                type="text"
                                class="form-control"
                                id="promo-code"
                                placeholder="Nhập mã khuyến mãi"
                                value="test00"
                            />
                            <button class="btn btn-primary" id="apply-promo">
                                Áp dụng
                            </button>
                        </div>
                    </div>

                    <div id="promo-result" class="mt-3" style="display: none">
                        <div class="alert alert-success">
                            <p>
                                <strong>Giảm giá:</strong>
                                <span id="discount-amount">0</span> VND
                            </p>
                            <p>
                                <strong>Tổng sau giảm:</strong>
                                <span id="final-price">0</span> VND
                            </p>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button
                            class="btn btn-success"
                            id="pay-zalopay"
                            disabled
                        >
                            Thanh toán ZaloPay
                        </button>
                    </div>
                </div>
            </div>

            <div id="response-log" class="mt-4" style="display: none">
                <h5>Log Response:</h5>
                <pre id="log-content" class="bg-light p-3"></pre>
            </div>
        </div>

        <script>
            let appliedPromotion = null;
            const datVeId = 80;
            const originalPrice = 75072;

            $("#apply-promo").click(function () {
                const promoCode = $("#promo-code").val();

                if (!promoCode) {
                    alert("Vui lòng nhập mã khuyến mãi");
                    return;
                }

                $.ajax({
                    url: "/khuyen-mai/check-code",
                    method: "POST",
                    data: {
                        _token:
                            $('meta[name="csrf-token"]').attr("content") ||
                            "test",
                        ma_khuyen_mai: promoCode,
                        tong_tien: originalPrice,
                    },
                    success: function (response) {
                        if (response.success) {
                            appliedPromotion = {
                                id: response.khuyen_mai_id,
                                code: promoCode,
                                discount: response.discount,
                                finalPrice: originalPrice - response.discount,
                            };

                            $("#discount-amount").text(
                                response.discount.toLocaleString()
                            );
                            $("#final-price").text(
                                appliedPromotion.finalPrice.toLocaleString()
                            );
                            $("#promo-result").show();
                            $("#pay-zalopay").prop("disabled", false);

                            console.log("Promotion applied:", appliedPromotion);
                        } else {
                            alert(
                                "Mã khuyến mãi không hợp lệ: " +
                                    response.message
                            );
                        }
                    },
                    error: function () {
                        alert("Có lỗi xảy ra khi kiểm tra mã khuyến mãi");
                    },
                });
            });

            $("#pay-zalopay").click(function () {
                const paymentData = {
                    _token:
                        $('meta[name="csrf-token"]').attr("content") || "test",
                    dat_ve_id: datVeId,
                    phuong_thuc: "zalopay",
                };

                // Thêm thông tin khuyến mãi nếu có
                if (appliedPromotion) {
                    paymentData.khuyen_mai_id = appliedPromotion.id;
                    paymentData.ma_khuyen_mai = appliedPromotion.code;
                    paymentData.giam_gia = appliedPromotion.discount;
                    paymentData.tong_sau_giam = appliedPromotion.finalPrice;
                }

                console.log("Sending payment data:", paymentData);

                $.ajax({
                    url: "/thanh-toan/xu-ly",
                    method: "POST",
                    data: paymentData,
                    success: function (response) {
                        $("#log-content").text(
                            JSON.stringify(response, null, 2)
                        );
                        $("#response-log").show();

                        if (response.return_code === 1) {
                            console.log("ZaloPay order created successfully");
                            alert(
                                "Tạo đơn hàng ZaloPay thành công! Kiểm tra log để xem chi tiết."
                            );
                        } else {
                            alert("Có lỗi: " + response.return_message);
                        }
                    },
                    error: function (xhr) {
                        const errorText = xhr.responseText || "Unknown error";
                        $("#log-content").text("Error: " + errorText);
                        $("#response-log").show();
                        alert("Có lỗi xảy ra khi tạo đơn hàng ZaloPay");
                    },
                });
            });

            // Auto apply promo for quick testing
            setTimeout(() => {
                $("#apply-promo").click();
            }, 1000);
        </script>
    </body>
</html>
